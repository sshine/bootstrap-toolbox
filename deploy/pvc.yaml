apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bootstrap-toolbox-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Holds the seeded nix store plus everything built in-pod, so it is sized
      # well above the image. Override in kustomization.yaml (see the patch there).
      storage: 20Gi
