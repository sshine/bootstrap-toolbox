apiVersion: apps/v1
kind: Deployment
metadata:
  name: bootstrap-toolbox
  labels:
    app: bootstrap-toolbox
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the RWO PVC attaches to one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bootstrap-toolbox
  template:
    metadata:
      labels:
        app: bootstrap-toolbox
    spec:
      # Restricted Pod Security Standard; fsGroup makes the PVC writable by 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Mounting the PVC at /nix would shadow the baked store — and with it every
      # binary in /bin — so copy that store onto the PVC before the pod starts.
      # Skipped on later starts; watch the first one with
      #   kubectl logs deploy/bootstrap-toolbox -c seed-nix -f
      initContainers:
        - name: seed-nix
          # Overridden by the images: transformer in kustomization.yaml.
          image: ghcr.io/sshine/bootstrap-toolbox:latest
          command: ["/bin/seed-nix"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /seed
              subPath: nix
      containers:
        - name: toolbox
          # Overridden by the images: transformer in kustomization.yaml.
          image: ghcr.io/sshine/bootstrap-toolbox:latest
          command: ["/bin/sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # /root (the image's HOME) is not writable as UID 1000; use the PVC.
            - name: HOME
              value: /workspace
          volumeMounts:
            # One PVC, two subPaths: the nix store has to keep its real location
            # (a store mounted anywhere else is a diverted store, which nix can
            # only build in through a chroot this pod may not create).
            - name: data
              mountPath: /nix
              subPath: nix
            - name: data
              mountPath: /workspace
              subPath: workspace
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bootstrap-toolbox-data
